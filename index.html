<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full AR QWERTY Keyboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #222; color: white; margin: 0; padding: 10px; }
        /* CSS to ensure video fits on mobile screens properly */
        canvas { 
            border: 2px solid #444; 
            border-radius: 10px; 
            margin-top: 10px; 
            background-color: black;
            max-width: 100%;
            height: auto;
        }
        #output { font-size: 24px; margin-top: 15px; color: #00ff00; font-weight: bold; }
        #input-text { 
            margin-top: 15px; font-size: 20px; padding: 10px; 
            width: 80%; max-width: 600px; border-radius: 5px; 
            background: #333; color: white; border: 1px solid #555;
        }
    </style>
</head>
<body>

    <h2>Full AR QWERTY Keyboard</h2>
    <div id="output">Key Hover: NONE</div>
    <input type="text" id="input-text" placeholder="Your typed text will appear here..." readonly />
    
    <video id="input_video" style="display: none;" playsinline></video>
    
    <canvas id="output_canvas" width="640" height="480"></canvas>

    <script>
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const outputText = document.getElementById('output');
        const inputTextField = document.getElementById('input-text');

        // Dynamic QWERTY Keyboard Generation
        const keys = [];
        const layout = [
            ['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'],
            ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L'],
            ['Z', 'X', 'C', 'V', 'B', 'N', 'M', 'SPACE', 'DEL']
        ];
        
        const keySize = 45; // Width and height of keys
        const gap = 10;     // Space between keys
        let startY = 220;   // Starting Y position on canvas

        layout.forEach((row, rowIndex) => {
            // Stagger rows slightly like a real keyboard
            let startX = 20 + (rowIndex * 20); 
            
            row.forEach((char, colIndex) => {
                let w = keySize;
                // Make Space and Del keys slightly wider
                if(char === 'SPACE') w = keySize * 3;
                if(char === 'DEL') w = keySize * 1.5;

                keys.push({
                    x: startX,
                    y: startY + (rowIndex * (keySize + gap)),
                    w: w,
                    h: keySize,
                    label: char
                });
                
                startX += w + gap; // Move X forward for the next key
            });
        });

        function calculateDistance(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        }

        // To prevent multiple types from a single pinch, we use a debounce flag
        let isPinching = false;

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            // Draw Camera Stream
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            let hoveredKey = "NONE";

            // Draw Keyboard
            keys.forEach(key => {
                canvasCtx.beginPath();
                canvasCtx.rect(key.x, key.y, key.w, key.h);
                canvasCtx.fillStyle = 'rgba(255, 255, 255, 0.2)'; 
                canvasCtx.fill();
                canvasCtx.lineWidth = 2;
                canvasCtx.strokeStyle = 'white';
                canvasCtx.stroke();
                
                canvasCtx.fillStyle = 'white';
                // Adjust font size based on key type
                canvasCtx.font = (key.label.length > 1) ? "14px Arial" : "20px Arial";
                let textX = (key.label.length > 1) ? key.x + 5 : key.x + 15;
                canvasCtx.fillText(key.label, textX, key.y + 30);
            });

            // Hand Tracking Logic
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                for (const landmarks of results.multiHandLandmarks) {
                    
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
                    drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 1, radius: 2});

                    let indexTip = { x: landmarks[8].x * canvasElement.width, y: landmarks[8].y * canvasElement.height };
                    let thumbTip = { x: landmarks[4].x * canvasElement.width, y: landmarks[4].y * canvasElement.height };

                    let pinchDist = calculateDistance(indexTip, thumbTip);
                    let currentPinch = pinchDist < 30;

                    // Hover Detection
                    keys.forEach(key => {
                        if (indexTip.x >= key.x && indexTip.x <= (key.x + key.w) &&
                            indexTip.y >= key.y && indexTip.y <= (key.y + key.h)) {
                            
                            hoveredKey = key.label;
                            
                            // Highlight hovered key
                            canvasCtx.beginPath();
                            canvasCtx.rect(key.x, key.y, key.w, key.h);
                            canvasCtx.fillStyle = currentPinch ? 'rgba(0, 255, 0, 0.7)' : 'rgba(255, 255, 0, 0.5)';
                            canvasCtx.fill();

                            // Trigger Type on Pinch
                            if (currentPinch && !isPinching) {
                                if (key.label === 'SPACE') {
                                    inputTextField.value += ' ';
                                } else if (key.label === 'DEL') {
                                    inputTextField.value = inputTextField.value.slice(0, -1);
                                } else {
                                    inputTextField.value += key.label;
                                }
                            }
                        }
                    });
                    
                    isPinching = currentPinch; // Update pinch state for next frame
                }
            } else {
                isPinching = false;
            }
            
            outputText.innerText = "Key Hover: " + hoveredKey;
            canvasCtx.restore();
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });
        hands.onResults(onResults);

        // --- CAMERA FIX: facingMode: 'environment' forces the back camera ---
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 640,
            height: 480,
            facingMode: 'environment' // THIS ENFORCES BACK CAMERA
        });
        camera.start();
    </script>
</body>
</html>
